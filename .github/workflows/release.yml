name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o dcmd-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/dcmd

      - uses: actions/upload-artifact@v4
        with:
          name: dcmd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dcmd-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            dcmd-*

  update-tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: karpikorop/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Update the formula
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          url="https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          curl -fsSL -o source.tar.gz "$url"
          sha=$(sha256sum source.tar.gz | cut -d' ' -f1)
          rm source.tar.gz

          sed -i -E \
            -e "s|^  url \".*\"$|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            Formula/dcmd.rb
          grep -qF "url \"$url\"" Formula/dcmd.rb
          grep -qF "sha256 \"$sha\"" Formula/dcmd.rb

          if git diff --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dcmd $TAG"
          git push
